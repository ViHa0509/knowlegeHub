[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kh-helper"
version = "1.19.3"
description = "Knowledge Hub client helper: sign-in, Claude Code hooks, MCP server knowledge-hub, auto work log"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "keyring>=25,<26",
    "mcp>=2.2,<3",
]

[project.scripts]
kh = "kh_helper.cli:main"

[tool.setuptools]
packages = ["kh_helper"]
